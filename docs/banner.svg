<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="picsum-kotlin: Kotlin client for Lorem Picsum with a Compose tablet photo gallery" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1626"/>
      <stop offset="1" stop-color="#1E2D4F"/>
    </linearGradient>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B267"/>
      <stop offset="1" stop-color="#F25F5C"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FC8F8"/>
      <stop offset="1" stop-color="#3A7CA5"/>
    </linearGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3B1E1"/>
      <stop offset="1" stop-color="#6D5BA8"/>
    </linearGradient>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8E6CF"/>
      <stop offset="1" stop-color="#3B8F6E"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9D9D9"/>
      <stop offset="1" stop-color="#707070"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="c1"><rect x="738" y="132" width="150" height="112" rx="10"/></clipPath>
    <clipPath id="c2"><rect x="738" y="256" width="150" height="190" rx="10"/></clipPath>
    <clipPath id="c3"><rect x="900" y="132" width="150" height="176" rx="10"/></clipPath>
    <clipPath id="c4"><rect x="900" y="320" width="150" height="126" rx="10"/></clipPath>
    <clipPath id="c5"><rect x="1062" y="132" width="122" height="140" rx="10"/></clipPath>
    <clipPath id="c6"><rect x="1062" y="284" width="122" height="162" rx="10"/></clipPath>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="180" fill="#2E5AAC" opacity="0.18"/>
  <circle cx="60" cy="560" r="200" fill="#F25F5C" opacity="0.08"/>

  <!-- Title -->
  <text x="72" y="196" font-family="Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#FFFFFF">picsum-kotlin</text>
  <text x="74" y="246" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#C9D3EA">Kotlin client for Lorem Picsum with a</text>
  <text x="74" y="280" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#C9D3EA">Compose tablet photo gallery</text>

  <!-- Chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="72" y="320" width="122" height="38" rx="19" fill="#2E5AAC"/>
    <text x="133" y="345" text-anchor="middle" fill="#FFFFFF">Photo list</text>
    <rect x="206" y="320" width="104" height="38" rx="19" fill="#2E5AAC"/>
    <text x="258" y="345" text-anchor="middle" fill="#FFFFFF">Authors</text>
    <rect x="322" y="320" width="84" height="38" rx="19" fill="#2E5AAC"/>
    <text x="364" y="345" text-anchor="middle" fill="#FFFFFF">Seeds</text>
    <rect x="72" y="370" width="84" height="38" rx="19" fill="#34405E"/>
    <text x="114" y="395" text-anchor="middle" fill="#E7ECF8">Blur</text>
    <rect x="168" y="370" width="122" height="38" rx="19" fill="#34405E"/>
    <text x="229" y="395" text-anchor="middle" fill="#E7ECF8">Grayscale</text>
    <rect x="302" y="370" width="150" height="38" rx="19" fill="#34405E"/>
    <text x="377" y="395" text-anchor="middle" fill="#E7ECF8">Wallpapers</text>
    <rect x="464" y="370" width="132" height="38" rx="19" fill="#34405E"/>
    <text x="530" y="395" text-anchor="middle" fill="#E7ECF8">Link paging</text>
  </g>
  <text x="74" y="460" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8D9AB8">Photos by Unsplash photographers, served by picsum.photos</text>

  <!-- Tablet -->
  <rect x="682" y="78" width="556" height="410" rx="30" fill="#0A0F1A"/>
  <rect x="694" y="90" width="532" height="386" rx="20" fill="#F7F7F5"/>
  <!-- Rail -->
  <rect x="694" y="90" width="34" height="386" rx="20" fill="#ECECE9"/>
  <rect x="704" y="132" width="14" height="14" rx="3" fill="#2E5AAC"/>
  <circle cx="711" cy="170" r="6" fill="#9AA0AC"/>
  <rect x="738" y="104" width="120" height="12" rx="6" fill="#1A1B1E"/>
  <rect x="1104" y="102" width="80" height="18" rx="9" fill="#DCE2F9"/>

  <!-- Photo tiles: abstract landscapes -->
  <g clip-path="url(#c1)">
    <rect x="738" y="132" width="150" height="112" fill="url(#sky1)"/>
    <circle cx="840" cy="178" r="16" fill="#FFE8A3"/>
    <path d="M738 244 L790 196 L822 222 L858 186 L888 214 L888 244 Z" fill="#5B2A3B"/>
  </g>
  <g clip-path="url(#c2)">
    <rect x="738" y="256" width="150" height="190" fill="url(#sky2)"/>
    <path d="M738 446 L738 360 L776 312 L812 350 L850 300 L888 352 L888 446 Z" fill="#1F4E6B"/>
    <path d="M738 446 L738 400 L800 372 L888 404 L888 446 Z" fill="#163A50"/>
  </g>
  <g clip-path="url(#c3)">
    <rect x="900" y="132" width="150" height="176" fill="url(#gray)"/>
    <path d="M900 308 L900 236 L944 196 L984 240 L1018 210 L1050 236 L1050 308 Z" fill="#4A4A4A"/>
    <circle cx="1010" cy="168" r="14" fill="#F2F2F2"/>
  </g>
  <g clip-path="url(#c4)">
    <g filter="url(#blur)">
      <rect x="890" y="310" width="170" height="146" fill="url(#sky3)"/>
      <circle cx="950" cy="360" r="22" fill="#FFD6E0"/>
      <path d="M890 456 L940 396 L980 424 L1020 384 L1060 420 L1060 456 Z" fill="#3E2F6B"/>
    </g>
  </g>
  <g clip-path="url(#c5)">
    <rect x="1062" y="132" width="122" height="140" fill="url(#sky4)"/>
    <path d="M1062 272 L1062 216 L1092 188 L1122 220 L1152 194 L1184 222 L1184 272 Z" fill="#245C47"/>
  </g>
  <g clip-path="url(#c6)">
    <rect x="1062" y="284" width="122" height="162" fill="url(#sky1)"/>
    <rect x="1062" y="390" width="122" height="56" fill="#2E5AAC" opacity="0.85"/>
    <circle cx="1123" cy="350" r="20" fill="#FFF1C1"/>
  </g>
  <!-- Author captions -->
  <rect x="738" y="452" width="90" height="8" rx="4" fill="#45464A"/>
  <rect x="900" y="452" width="70" height="8" rx="4" fill="#45464A"/>
  <rect x="1062" y="452" width="80" height="8" rx="4" fill="#45464A"/>
</svg>
